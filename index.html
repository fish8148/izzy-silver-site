<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark" />
    <title>izzy_silver</title>
    <meta name="description" content="izzy_silver — University of Waterloo student. Portfolio: projects, photos, and a 3D me you can poke." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <main>
      <section class="hero" id="top" aria-label="Intro">
        <h1 class="sr-only">izzy_silver</h1>

        <div class="hero__floor" aria-hidden="true"></div>

        <!-- Dance Party light show (hidden until the party starts) -->
        <div class="hero__party" aria-hidden="true">
          <div class="party-wash"></div>
          <div class="party-beam"></div>
          <div class="party-pool"></div>
        </div>

        <!-- A still of the character, shown while the 3D one loads (made by src/scene/poster.js) -->
        <img class="hero__poster" src="/character-poster.webp" alt="" aria-hidden="true" decoding="async" fetchpriority="high" onerror="this.remove()" />

        <canvas
          class="hero__canvas"
          id="stage"
          aria-label="Interactive 3D character. Click it to change what it's doing, or drag to look around."
        ></canvas>

        <div class="hero__loader" id="loader" role="status">
          <span>loading</span>
          <div class="hero__loader-bar"><span></span></div>
        </div>

        <!-- Floats above the character's head and follows it -->
        <p class="nametag" id="nametag" aria-hidden="true"><span class="nametag__text">izzy_silver</span></p>

        <!--
          Floating labels. Each one is placed by a few numbers:
            --h       height on the character, 0 = feet, 1 = top of head
            --want    how far from the centre line it would like to sit (the CSS shrinks this if the label wouldn't fit)
            --chars   how many letters it has (--chars-short for the short text phones get), for that fit
            --bob     seconds per float loop, --bob-delay where in the loop it starts, --amp how far it floats
            --depth   how far it sways with a phone's movement (src/ui/sway.js)
          Left-side labels grow leftwards, right-side labels rightwards.
          Under 640px the short text replaces the full text.
        -->
        <nav class="floaters" aria-label="Sections">
          <div class="floater" data-side="left" style="--h: 0.84; --want: clamp(150px, 19vw, 440px); --chars: 8; --bob: 9.6s; --bob-delay: -1.2s; --amp: 1.1; --depth: 1.15">
            <button
              class="floater__label floater__label--accent"
              id="interact-toggle"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="interact-menu"
            >
              interact
            </button>
            <div class="interact-menu" id="interact-menu" role="menu" aria-label="Interact" hidden></div>
          </div>

          <div class="floater" data-side="right" style="--h: 0.71; --want: clamp(160px, 21vw, 480px); --chars: 8; --chars-short: 5; --bob: 8.2s; --bob-delay: -3.1s; --amp: 0.9; --depth: 0.85">
            <a class="floater__label" href="#about" data-page="about"><span class="full">about me</span><span class="short">about</span></a>
          </div>

          <div class="floater" data-side="left" style="--h: 0.56; --want: clamp(170px, 24vw, 560px); --chars: 6; --bob: 10.4s; --bob-delay: -0.4s; --amp: 1.2; --depth: 1.3">
            <a class="floater__label" href="#say-hi" data-page="say-hi">say hi</a>
          </div>

          <div class="floater" data-side="right" style="--h: 0.4; --want: clamp(160px, 18.5vw, 420px); --chars: 6; --chars-short: 4; --bob: 8.9s; --bob-delay: -2.4s; --amp: 1; --depth: 1">
            <a class="floater__label" href="#photos" data-page="photos"><span class="full">photos</span><span class="short">pics</span></a>
          </div>

          <div class="floater" data-side="left" style="--h: 0.07; --want: clamp(150px, 17vw, 400px); --chars: 9; --chars-short: 6; --bob: 9.8s; --bob-delay: -4.2s; --amp: 0.95; --depth: 0.75">
            <a class="floater__label" href="#my-things" data-page="my-things"><span class="full">my things</span><span class="short">things</span></a>
          </div>
        </nav>

        <!-- Sub-pages open here (see src/pages). Each is filled in by JS the first time it's opened. -->
        <div class="pages" id="pages">
          <section class="page" id="page-about" data-page="about" aria-label="About me" tabindex="-1" hidden></section>
          <section class="page" id="page-say-hi" data-page="say-hi" aria-label="Say hi" tabindex="-1" hidden></section>
          <section class="page" id="page-photos" data-page="photos" aria-label="Photos" tabindex="-1" hidden></section>
          <section class="page" id="page-my-things" data-page="my-things" aria-label="My things" tabindex="-1" hidden></section>
        </div>

        <button class="party-stop" id="party-stop" type="button">stop party <kbd>esc</kbd></button>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
