<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>izzy_silver</title>
    <meta name="description" content="Izzy Silver, a computer engineering student at the University of Waterloo. About me, photos, and a 3D me you can poke." />
    <!-- The card a link shows when it's shared (iMessage, LinkedIn, Slack...). The image is a still of the old homepage. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://isilver.uwce.ca/" />
    <meta property="og:title" content="Izzy Silver Portfolio Site" />
    <meta property="og:description" content="Izzy Silver, a computer engineering student at the University of Waterloo. About me, photos, and a 3D me you can poke." />
    <meta property="og:image" content="https://isilver.uwce.ca/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Izzy's 3D character waving on a dark stage, surrounded by the links interact, about me, say hi and photos" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Izzy Silver Portfolio Site" />
    <meta name="twitter:image" content="https://isilver.uwce.ca/og-image.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <main>
      <section class="hero" id="top" aria-label="Izzy Silver">
        <h1 class="sr-only">izzy_silver</h1>

        <!-- The pages (see src/pages). Each is filled in by JS the first time it's shown; the site opens on about me. -->
        <div class="pages" id="pages">
          <section class="page" id="page-about" data-page="about" aria-label="About me" tabindex="-1" hidden></section>
          <section class="page" id="page-say-hi" data-page="say-hi" aria-label="Say hi" tabindex="-1" hidden></section>
          <section class="page" id="page-photos" data-page="photos" aria-label="Photos" tabindex="-1" hidden></section>
          <!-- <section class="page" id="page-my-things" data-page="my-things" aria-label="My things" tabindex="-1" hidden></section> -->
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
