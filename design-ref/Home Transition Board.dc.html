        ['about me', 'interact', 'photos', 'say hi', 'my things'].forEach((n, i) => {
          const sp = spot(n), left = sp.x < 640, dist = left ? sp.x + 260 : 1340 - sp.x;
          L[n].v = { x: left ? -260 : 1340, y: sp.y + 10, s: 0.96, o: 0 };
          this.apply({ [n]: { ...sp, o: 1, delay: i * 55, dur: 900 + dist * 0.35, ease: 'outQuint', oRange: [0, 0.45] } });
        });
        L.homepage.v = { ...spot('homepage') };
      });
      total = 1700;
    } else if (v === 'edges') {
      const t = {};
      this.O.forEach((n) => {
        const k = n === from ? -1 : this.layoutPage(from, true)[n].k;
        t[n] = { x: 1330, y: L[n].v.y, s: L[n].v.s, o: 0, delay: (4 - (k + 1)) * 40, dur: 420, ease: 'inCubic' };
      });
      this.apply(t);
      this.later(250, () => this.showContent('homepage'));
      this.later(420, () => {
        ['interact', 'about me', 'say hi', 'photos', 'my things'].forEach((n, i) => {
          const sp = spot(n), left = sp.x < 640;
          L[n].v = { x: left ? -280 : 1330, y: sp.y, s: 1, o: 0 };
          this.apply({ [n]: { ...sp, o: 1, delay: i * 70, dur: 950, ease: 'outCubic' } });
        });
        L.homepage.v = { ...spot('homepage') };
      });
      total = 1800;
    } else {
      this.later(200, () => this.showContent('homepage'));
      const deal = this.O.filter((n) => n !== from);
      deal.push(from);
      deal.forEach((n, i) => {
        if (n === 'homepage') { this.later(i * 150, () => morph(0, 720, { arcY: -70, sEase: 'outCubic' })); return; }
        this.apply({ [n]: { ...spot(n), delay: i * 150, dur: 720, ease: 'inOutCubic', sEase: 'outCubic', arcY: -70, arcX: spot(n).x < 640 ? -30 : 30 } });
      });
      total = 150 * deal.length + 800;
    }
    this.later(10, () => { this.page = 'homepage'; });
    this.later(total, () => { this.busy = false; });
  }
  goPage(n) {
    this.busy = true;
    const v = this.props.variant ?? 'direct', L = this.labels;
    this.page = n;
    this.later(200, () => this.showContent(n));
    const t = {};
    t[n] = { x: this.HX, y: this.HY, s: 1, o: 1, dur: 760, ease: 'inOutCubic' };
    ['interact', 'say hi', 'photos', 'my things', 'about me'].filter((k) => k !== n).forEach((k, i) => {
      if (v === 'edges2') t[k] = { x: L[k].v.x < 640 ? -260 : 1340, y: L[k].v.y - 6, s: 0.96, o: 0, delay: i * 35, dur: 520, ease: 'inQuad', oRange: [0.3, 1] };
      else if (v === 'edges') t[k] = { x: L[k].v.x < 640 ? -280 : 1330, y: L[k].v.y, s: 1, o: 0, delay: i * 40, dur: 460, ease: 'inCubic' };
      else if (v === 'bloom') t[k] = { x: 610, y: 390, s: 0.35, o: 0, delay: i * 40, dur: 460, ease: 'inCubic' };
      else t[k] = { x: this.HX, y: this.HY + 4, s: this.ITEM, o: 0, delay: i * 40, dur: 620, ease: 'inOutCubic' };
    });
    this.apply(t);
    this.later(900, () => {
      const c = this.layoutPage(n, false); delete c[n];
      this.apply(c, { dur: 0 });
      this.busy = false;
    });
  }
  renderVals() {
    return {
      rootRef: this.rootRef,
      replay: (e) => {
        e.stopPropagation();
        this.reset(true);
        this.later(650, () => this.goHome());
      },
    };
  }
}
</script>
