<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
html{background:#111}body{margin:0;background:#111;color:#f4f4f4;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6fb3e0;text-decoration:none}a:hover{color:#a9d3ef}
*{box-sizing:border-box}
input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#4a4a4a}
</style>
</helmet>
<section data-screen-label="Say hi" style="padding:64px;display:flex;justify-content:center">
  <div style="position:relative;flex:none;width:1280px;height:720px;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #2a2a2a;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:64px;padding:72px 56px 56px">
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;justify-content:center;gap:28px">
        <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;font-size:34px;line-height:1.5;color:#fff">
          <span>hi izzy, i’m</span>
          <input placeholder="your name" value="{{ name }}" onChange="{{ setName }}" style="width:300px;background:none;border:none;border-bottom:1px solid #3a3a3a;color:#6fb3e0;font-size:34px;padding:0 0 4px;outline:none">
          <span>and you can reach me at</span>
          <input placeholder="your email" value="{{ from }}" onChange="{{ setFrom }}" style="width:420px;background:none;border:none;border-bottom:1px solid #3a3a3a;color:#6fb3e0;font-size:34px;padding:0 0 4px;outline:none">
        </div>
        <textarea placeholder="what’s on your mind…" value="{{ msg }}" onChange="{{ setMsg }}" style="height:160px;resize:none;background:#121212;border:none;border-radius:28px;padding:24px 28px;color:#fff;font-size:20px;line-height:1.5;outline:none"></textarea>
        <div style="display:flex;align-items:center;gap:28px">
          <div onClick="{{ send }}" style="cursor:pointer;font-size:20px;padding:14px 28px;border-radius:999px;background:{{ sendBg }};color:{{ sendFg }};transition:background .2s ease">send ↗</div>
          <div style="font-size:15px;color:#5a5a5a">or email <span onClick="{{ copy }}" style="cursor:pointer;color:#6fb3e0">{{ email }}</span> {{ copyLabel }}</div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;justify-content:center;gap:20px">
        <div style="font-size:52px;line-height:1.1;color:#6fb3e0">thanks{{ nameComma }}</div>
        <div style="font-size:34px;line-height:1.3;color:#fff">i’ll get back to you soon.</div>
        <div onClick="{{ reset }}" style="cursor:pointer;font-size:15px;color:#5a5a5a;margin-top:12px">write another</div>
      </div>
    </sc-if>
    <div style="height:100%;display:flex;flex-direction:column;gap:20px">
      <div style="flex:1">
        <div data-model-mount="izzy" style="height:100%;border-radius:28px;background:#0a0a0a;box-shadow:inset 0 0 0 1px #262626;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
          <div style="font-size:15px;color:#8f8f8f">3d model of me</div>
          <div style="font-size:13px;color:#4a4a4a">mounts from the site’s existing model</div>
        </div>
      </div>
      <div style="display:flex;gap:24px;font-size:15px">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
          <a href="#" style="color:#8f8f8f" style-hover="color:#6fb3e0">{{ l.name }} ↗</a>
        </sc-for>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { copied: false, name: '', from: '', msg: '', sent: false };
  email = 'hi@izzysilver.com';
  copy = () => {
    try { navigator.clipboard.writeText(this.email); } catch (e) {}
    this.setState({ copied: true });
    clearTimeout(this.t); this.t = setTimeout(() => this.setState({ copied: false }), 1600);
  };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state;
    const ready = s.msg.trim().length > 0;
    return {
      email: this.email, copy: this.copy,
      links: [{ name: 'linkedin' }, { name: 'github' }, { name: 'instagram' }],
      copyLabel: s.copied ? 'copied' : 'click to copy',
      name: s.name, from: s.from, msg: s.msg,
      setName: (e) => this.setState({ name: e.target.value }),
      setFrom: (e) => this.setState({ from: e.target.value }),
      setMsg: (e) => this.setState({ msg: e.target.value }),
      sendBg: ready ? '#6fb3e0' : '#1c1c1c', sendFg: ready ? '#000' : '#5a5a5a',
      send: () => { if (ready) this.setState({ sent: true }); },
      reset: () => this.setState({ sent: false, msg: '' }),
      sent: s.sent, notSent: !s.sent,
      nameComma: s.name.trim() ? ', ' + s.name.trim() : '',
    };
  }
}
</script>
</body>
</html>
