        const HX = this.HX, HY = this.HY;
        this.apply({ [old]: { x: HX, y: HY - 30, s: this.ITEM, o: 0 } }, { dur: 300, ease: 'inCubic' });
        this.labels[n].v = { x: HX, y: HY + 34, s: 1, o: 0 };
        this.apply({ [n]: { x: HX, y: HY, s: 1, o: 1 } }, { dur: 480, ease: 'outBack', delay: 140 });
        this.cur = n;
      });
      this.later(1000, () => {
        const t = this.layout(n, false); delete t[n];
        this.apply(t, { dur: 0 });
      });
      done(1000);
      return;
    }
    this.cur = n;
    const t = this.layout(n, true);
    if (anim === 'arc') {
      t[n] = { ...t[n], arcX: 110, arcY: 12, sEase: 'outBack', ease: 'inOutCubic', dur: 760, delay: 0 };
      t[old] = { ...t[old], arcX: -90, ease: 'inOutCubic', dur: 760, delay: 60 };
      for (const k in t) if (k !== n && k !== old) t[k] = { ...t[k], delay: 120 + (t[k].k || 0) * 60, dur: 520, ease: 'outCubic' };
      this.apply(t, {});
      this.later(820, () => { this.labels[old].pulseUntil = performance.now() + 650; });
      this.later(1700, () => this.closeMenu());
      done(2050);
      return;
    }
    this.apply(t, { dur: 620, ease: 'inOutCubic', delay: 0 });
    this.later(1350, () => this.closeMenu());
    done(1700);
  }
  renderVals() { return { rootRef: this.rootRef }; }
}
</script>
